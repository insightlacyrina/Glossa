plugins { id 'com.android.application' }

dependencies {
    // Ink models are explicitly downloaded by the user, then run entirely on device.
    implementation 'com.google.mlkit:digital-ink-recognition:19.0.0'
    // Bundle Chinese/Latin image OCR so screenshots work on the first offline launch.
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}

android {
    namespace 'local.quietpaper'
    compileSdk 35
    defaultConfig {
        applicationId 'local.quietpaper'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.1.4'
        testInstrumentationRunner 'local.quietpaper.NativeRoundTripInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    // Optional research JNI is generated locally and belongs only to the test APK.
    sourceSets.androidTest.jniLibs.srcDir(layout.buildDirectory.dir('generated/adler-probe/jniLibs'))
}

tasks.register('syncWebAssets', Sync) {
    def webRoot = rootProject.file('../dist')
    from(webRoot)
    into layout.projectDirectory.dir('src/main/assets/web')
    doFirst {
        if (!new File(webRoot, 'index.html').exists()) {
            throw new GradleException('Web assets missing. Run npm ci && npm run build from the project root first.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'syncWebAssets' }
